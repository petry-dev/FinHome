version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: finhome-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SERVER_PASSWORD}
      MSSQL_PID: Express
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finhome-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - SQL_SERVER_HOST=sqlserver
      - SQL_SERVER_PORT=1433
      - SQL_SERVER_DB=${SQL_SERVER_DB}
      - SQL_SERVER_PASSWORD=${SQL_SERVER_PASSWORD}
    ports:
      - "5000:8080"
    depends_on:
      - sqlserver

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finhome-frontend
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  sqldata:
